<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BetaFlow builds semantic search, adapts AI models through fine-tuning, and explores efficient generative AI with low-rank methods.">
  
  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:title" content="BetaFlow | AI Engineering & Research">
  <meta property="og:description" content="Semantic search architectures, domain fine-tuning, and low-rank tensor methods for efficient generative AI.">
  <meta property="og:type" content="website">
  
  <title>BetaFlow | AI Engineering &amp; Research</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --surface: #131e30;
      --text: #eef3fc;
      --muted: #adbbd0;
      --accent: #7dd3fc;
      --border: #29374c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.65;
    }
    .container { width: min(1080px, 90%); margin-inline: auto; }
    a { color: var(--accent); }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-block: 24px;
      gap: 20px;
    }
    .brand {
      color: var(--text);
      font-size: 1.5rem;
      font-weight: 750;
      text-decoration: none;
      letter-spacing: -1px;
    }
    nav .contact-link { 
      text-decoration: none; 
      font-weight: 600;
    }
    .hero { padding: 95px 0 85px; max-width: 850px; }
    .eyebrow {
      color: var(--accent);
      font-size: .85rem;
      font-weight: 650;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    h1 {
      font-size: clamp(2.7rem, 7vw, 4.8rem);
      line-height: 1.08;
      letter-spacing: -2px;
      margin: 20px 0;
    }
    .intro { max-width: 650px; color: var(--muted); font-size: 1.2rem; }
    
    .cta-group {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 24px;
    }
    .button {
      display: inline-block;
      padding: 13px 23px;
      background: var(--accent);
      color: var(--bg);
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .button:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }
    .button-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .button-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
    section { padding-bottom: 70px; }
    h2 { font-size: 1.9rem; letter-spacing: -.5px; }
    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }
    .card {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      padding: 26px;
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: border-color 0.2s ease;
    }
    .card:hover {
      border-color: var(--accent);
    }
    .card h3 { font-size: 1.3rem; line-height: 1.3; margin: 0 0 12px; }
    .card p, .about p { color: var(--muted); }
    .card .value { margin-top: auto; padding-top: 10px; }
    .card
